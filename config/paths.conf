# ==========================================================
# Theme Engine Paths
# ==========================================================

# THEME_ROOT is resolved from engine/bin/theme before this data file is parsed.

ENGINE_DIR="$THEME_ROOT/engine"

MODULES_DIR="$THEME_ROOT/modules"

RUNTIME_DIR="$THEME_ROOT/runtime"

CONFIG_DIR="$THEME_ROOT/config"

ASSETS_DIR="$THEME_ROOT/assets"

WALLPAPER_DIR="$HOME/Pictures/Wallpaper"

GENERATED_DIR="$RUNTIME_DIR/generated"

CACHE_DIR="$RUNTIME_DIR/cache"

STATE_DIR="$RUNTIME_DIR/state"

LOG_DIR="$RUNTIME_DIR/logs"

THEMES_DIR="$THEME_ROOT/themes"

CURRENT_THEME_FILE="$STATE_DIR/current_theme"
